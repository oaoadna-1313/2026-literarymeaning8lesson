<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文意新8課 ｜ 第5課 比較篇（應用文類）解說教材</title>
  <style>
    :root {
      --primary-color: #4c1d95;
      --primary-hover: #5b21b6;
      --primary-light: #f5f3ff;
      --accent-color: #b91c1c;
      --success-color: #059669;
      --success-light: #ecfdf5;
      --error-color: #dc2626;
      --error-light: #fef2f2;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --quote-bg: #fdfbf7;
      --quote-border: #d97706;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08), 0 8px 10px -6px rgba(0,0,0,0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Serif TC", serif, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部全域導航選單 */
    .top-navbar {
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.85rem;
      padding: 8px 20px;
      border-bottom: 1px solid #1e293b;
    }

    .top-navbar-container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top-units-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .unit-link {
      color: #cbd5e1;
      text-decoration: none;
      padding: 3px 10px;
      border-radius: 6px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .unit-link:hover {
      background: #334155;
      color: #ffffff;
    }

    .unit-link.active {
      background: var(--primary-color);
      color: #ffffff;
      font-weight: 700;
    }

    .home-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.1);
      transition: all 0.2s;
    }
    .home-link:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
    }

    /* 標頭 Header */
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-chapter {
      background: linear-gradient(135deg, var(--primary-color), #3b82f6);
      color: white;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .title-text {
      font-size: 1.22rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 6px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .control-btn:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    .control-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* 進度條與題號切換欄 */
    .progress-bar-wrapper {
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .progress-bar-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .q-tab {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      position: relative;
    }

    .q-tab:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background: var(--primary-light);
    }

    .q-tab.current {
      border-color: var(--primary-color);
      background: var(--primary-color);
      color: white;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
    }

    .q-tab.correct {
      border-color: var(--success-color);
      background: var(--success-light);
      color: var(--success-color);
    }

    .q-tab.correct.current {
      background: var(--success-color);
      color: white;
    }

    .q-tab.incorrect {
      border-color: var(--error-color);
      background: var(--error-light);
      color: var(--error-color);
    }

    .q-tab.incorrect.current {
      background: var(--error-color);
      color: white;
    }

    .stats-badge {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
      background: #f8fafc;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    /* 主內容容器 */
    main {
      max-width: 900px;
      width: 100%;
      margin: 24px auto;
      padding: 0 16px;
      flex: 1;
    }

    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      padding: 28px 32px;
      margin-bottom: 30px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .question-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .q-num-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-color);
    }

    .category-tag {
      background: var(--primary-light);
      color: var(--primary-color);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* 文本引文區塊 */
    .passage-box {
      background: var(--quote-bg);
      border-left: 5px solid var(--quote-border);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 20px 24px;
      margin-bottom: 22px;
      font-size: 1.15rem;
      line-height: 2.1;
      letter-spacing: 0.4px;
      color: #1e293b;
      position: relative;
    }

    .passage-author {
      display: block;
      margin-top: 10px;
      text-align: right;
      font-size: 0.95rem;
      color: #64748b;
      font-style: italic;
    }

    /* 題目題幹問句 */
    .stem-text {
      font-size: 1.18rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #0f172a;
      line-height: 1.7;
    }

    /* 注釋框 */
    .notes-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-md);
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #475569;
    }

    .notes-title {
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 選項列表 */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary-color);
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .option-label {
      font-weight: 800;
      font-size: 1.1rem;
      color: #475569;
      min-width: 32px;
    }

    .option-btn.selected-correct {
      background: var(--success-light) !important;
      border-color: var(--success-color) !important;
      color: #065f46 !important;
      font-weight: 700;
    }

    .option-btn.selected-correct .option-label {
      color: var(--success-color);
    }

    .option-btn.selected-incorrect {
      background: var(--error-light) !important;
      border-color: var(--error-color) !important;
      color: #991b1b !important;
      font-weight: 700;
    }

    .option-btn.selected-incorrect .option-label {
      color: var(--error-color);
    }

    .option-btn.reveal-correct {
      border-color: var(--success-color) !important;
      background: #f0fdf4 !important;
      color: #166534 !important;
      border-style: dashed !important;
    }

    /* 答題回饋橫幅 */
    .result-banner {
      border-radius: var(--radius-md);
      padding: 14px 20px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .result-banner.correct {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }

    .result-banner.incorrect {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .btn-retry {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-retry:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    /* 詳解摺疊卡片 */
    .explanation-container {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), opacity 0.4s ease-in-out;
    }

    .explanation-container.show {
      max-height: 2500px;
      opacity: 1;
      transition: max-height 0.8s ease-in-out, opacity 0.4s ease-in-out;
    }

    .explanation-card {
      background: #ffffff;
      border: 1px solid #fed7aa;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 15px rgba(251, 146, 60, 0.08);
      padding: 24px;
      margin-top: 10px;
      position: relative;
    }

    .explanation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #fef3c7;
    }

    .explanation-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #9a3412;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hl-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.84rem;
      background: #fdfbf7;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #fed7aa;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #78350f;
      font-weight: 600;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    /* 解題之眼線索框 */
    .clue-box {
      background: #fefce8;
      border-left: 4px solid #facc15;
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 18px;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #854d0e;
    }

    .clue-label {
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      color: #a16207;
    }

    /* 詳解段落 */
    .exp-paragraph {
      font-size: 1.1rem;
      line-height: 2.0;
      color: #334155;
      margin-bottom: 18px;
    }

    /* 螢光筆高亮樣式 */
    mark.hl-yellow {
      background: linear-gradient(104deg, rgba(254, 240, 138, 0.2) 0.9%, rgba(254, 240, 138, 0.95) 2.4%, rgba(254, 240, 138, 0.85) 98%);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 700;
      color: #1c1917;
      box-shadow: inset 0 -4px 0 rgba(234, 179, 8, 0.6);
    }

    mark.hl-pink {
      background: linear-gradient(104deg, rgba(254, 205, 211, 0.2) 0.9%, rgba(254, 205, 211, 0.95) 2.4%, rgba(254, 205, 211, 0.85) 98%);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 700;
      color: #881337;
      box-shadow: inset 0 -4px 0 rgba(244, 63, 94, 0.45);
    }

    mark.hl-green {
      background: linear-gradient(104deg, rgba(187, 247, 208, 0.2) 0.9%, rgba(187, 247, 208, 0.95) 2.4%, rgba(187, 247, 208, 0.85) 98%);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 700;
      color: #064e3b;
      box-shadow: inset 0 -4px 0 rgba(16, 185, 129, 0.45);
    }

    mark.hl-blue {
      background: linear-gradient(104deg, rgba(186, 230, 253, 0.2) 0.9%, rgba(186, 230, 253, 0.95) 2.4%, rgba(186, 230, 253, 0.85) 98%);
      border-radius: 4px;
      padding: 2px 6px;
      font-weight: 700;
      color: #075985;
      box-shadow: inset 0 -4px 0 rgba(14, 165, 233, 0.45);
    }

    .passage-box.revealed mark.hl-yellow {
      animation: pulseHighlight 1.5s infinite alternate;
    }

    @keyframes pulseHighlight {
      0% { box-shadow: inset 0 -4px 0 rgba(234, 179, 8, 0.6); }
      100% { box-shadow: inset 0 -10px 0 rgba(234, 179, 8, 0.8); }
    }

    /* 語譯與注釋卡片 */
    .translation-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px 20px;
      margin-top: 16px;
      font-size: 1.02rem;
      line-height: 1.9;
    }

    .translation-header {
      font-weight: 700;
      color: #0284c7;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 選項逐項剖析 */
    .option-analysis-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed #cbd5e1;
    }

    .analysis-item {
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .analysis-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .analysis-tag.is-correct {
      background: #dcfce7;
      color: #15803d;
    }

    .analysis-tag.is-wrong {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* 導航切換列 */
    .nav-buttons-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .nav-btn {
      padding: 10px 22px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 浮動字級工具列 */
    .floating-font-bar {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 6px 14px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 90;
    }

    .font-btn {
      background: #f1f5f9;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .font-btn:hover {
      background: #e2e8f0;
    }

    /* 動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .question-card {
        padding: 20px 16px;
      }
      .passage-box {
        font-size: 1.05rem;
        padding: 16px 18px;
      }
      .option-btn {
        padding: 12px 14px;
        font-size: 1rem;
      }
      .hl-legend {
        display: none;
      }
    }
  </style>
</head>

  <!-- 題號跳轉與統計列 -->
  <div class="progress-bar-wrapper">

    let currentQuestionIndex = 0;

    // 音效產生器（利用 Web Audio API 合成，免載入外部 mp3）
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.1); // A5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'incorrect') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(329.63, now); // E4
        osc.frequency.setValueAtTime(261.63, now + 0.15); // C4
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundToggleBtn");
      if (soundEnabled) {
        btn.classList.add("active");
        btn.innerHTML = `<span id="soundIcon">🔔</span> 音效已開啟`;
      } else {
        btn.classList.remove("active");
        btn.innerHTML = `<span id="soundIcon">🔕</span> 音效已靜音`;
      }
    }

    // 切換檢視模式（單題專注 vs 連續清單）
    function toggleViewMode() {
      isContinuousView = !isContinuousView;
      const btn = document.getElementById("viewModeBtn");
      const text = document.getElementById("viewModeText");
      if (isContinuousView) {
        btn.classList.add("active");
        text.innerText = "切換為專注模式";

        btn.classList.remove("active");
        text.innerText = "切換為連續模式";
      }
      renderView();
    }

    // 縮放字級
    function adjustFontSize(delta) {
      currentZoom += delta * 10;
      if (currentZoom < 80) currentZoom = 80;
      if (currentZoom > 140) currentZoom = 140;
      document.getElementById("fontSizeDisplay").innerText = currentZoom + "%";
      document.getElementById("questionsContainer").style.fontSize = (currentZoom / 100) + "rem";
    }

    // 渲染導航 Tab
    function renderNavTabs() {
      const container = document.getElementById("navTabs");
      container.innerHTML = "";
      questionsData.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "q-tab";
        btn.id = `navTab_${q.id}`;
        btn.innerText = q.id;
        
        if (!isContinuousView && idx === currentQuestionIndex) {
          btn.classList.add("current");
        }

        if (userAnswers[q.id]) {
          if (userAnswers[q.id].isCorrect) {
            btn.classList.add("correct");
          } else {
            btn.classList.add("incorrect");
          }
        }

        btn.onclick = () => {
          playSound('click');
          if (isContinuousView) {
            const card = document.getElementById(`qcard_${q.id}`);
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            currentQuestionIndex = idx;
            renderView();
          }
        };

        container.appendChild(btn);
      });

      updateStats();
    }

    // 更新統計資訊
    function updateStats() {
      const answeredKeys = Object.keys(userAnswers);
      const count = answeredKeys.length;
      document.getElementById("completedCount").innerText = count;
      document.getElementById("totalQuestionsCount").innerText = questionsData.length;

      if (count === 0) {
        document.getElementById("accuracyRate").innerText = "-";
        document.getElementById("accuracyRate").style.color = "var(--text-muted)";
      } else {
        const correctCount = answeredKeys.filter(k => userAnswers[k].isCorrect).length;
        const rate = Math.round((correctCount / count) * 100);
        const rateEl = document.getElementById("accuracyRate");
        rateEl.innerText = rate + "%";
        rateEl.style.color = rate >= 80 ? "var(--success-color)" : (rate >= 60 ? "#d97706" : "var(--error-color)");
      }
    }

              <div class="hl-legend">
                <div class="legend-item"><span class="legend-dot" style="background:#facc15"></span> 黃色：解題關鍵詞</div>
                <div class="legend-item"><span class="legend-dot" style="background:#f43f5e"></span> 粉紅：轉折詞／特殊標點</div>
                <div class="legend-item"><span class="legend-dot" style="background:#10b981"></span> 綠色：推論核心／主旨歸納</div>
              </div>
            </div>
            <div class="explanation-body">
              <div class="clue-box">
                <div class="clue-label">🎯 【解題之眼・關鍵線索】</div>
                <div>${q.clue}</div>
              </div>

              <div class="exp-paragraph">
                ${q.explanation}
              </div>

              ${transHtml}
              ${optAnalysisHtml}
            </div>
          </div>
        </div>
      `;

      let navButtonsHtml = "";
      if (!isContinuousView) {
        const isFirst = idx === 0;
        const isLast = idx === questionsData.length - 1;
        navButtonsHtml = `
          <div class="nav-buttons-container">
            <button class="nav-btn" onclick="prevQuestion()" ${isFirst ? 'disabled' : ''}>
              <span>⬅</span> 上一題
            </button>
            <div style="font-size:0.92rem;color:var(--text-muted);display:flex;align-items:center;">
              第 <strong>${q.id}</strong> / ${questionsData.length} 題
            </div>
            <button class="nav-btn" onclick="nextQuestion()" ${isLast ? 'disabled' : ''}>
              下一題 <span>➡</span>
            </button>
          </div>
        `;
      }

      return `
        <div class="question-card" id="qcard_${q.id}">
          <div class="question-header">
            <div class="q-num-badge">
              <span>第 ${q.id} 題</span>
              <span class="category-tag">${q.category}</span>
            </div>
            <div style="font-size:0.88rem;color:var(--text-muted)">比較篇・文意好試多</div>
          </div>

          <div class="passage-box ${revealedClass}" id="passage_${q.id}">
            ${passageHtml}
            ${q.author ? `<span class="passage-author">—— ${q.author}</span>` : ''}
          </div>

          <div class="stem-text">${q.stem}</div>

          ${notesHtml}

          <div class="options-grid">
            ${optionsHtml}
          </div>

          ${bannerHtml}
          ${explanationHtml}
          ${navButtonsHtml}
        </div>
      `;
    }

    function renderView() {
      const container = document.getElementById("questionsContainer");
      if (isContinuousView) {
        container.innerHTML = questionsData.map((q, idx) => buildQuestionCardHtml(q, idx)).join("");
      } else {
        const currentQ = questionsData[currentQuestionIndex];
        container.innerHTML = buildQuestionCardHtml(currentQ, currentQuestionIndex);
      }
      renderNavTabs();
    }

    function selectAnswer(qid, choiceKey) {
      const q = questionsData.find(item => item.id === qid);
      if (!q) return;

      const isCorrect = (choiceKey === q.answer);
      userAnswers[qid] = {
        choice: choiceKey,
        isCorrect: isCorrect
      };

      playSound(isCorrect ? 'correct' : 'incorrect');
      renderView();

      setTimeout(() => {
        const expEl = document.getElementById(`expContainer_${qid}`);
        if (expEl) {
          expEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, 100);
    }

    function retryQuestion(qid) {
      playSound('click');
      delete userAnswers[qid];
      renderView();
    }

    function resetAllProgress() {
      if (confirm("確定要清除所有作答紀錄並重新開始嗎？")) {
        playSound('click');
        userAnswers = {};
        currentQuestionIndex = 0;
        renderView();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        playSound('click');
        currentQuestionIndex--;
        renderView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < questionsData.length - 1) {
        playSound('click');
        currentQuestionIndex++;
        renderView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderView();
    });
  </script>
</body>
</html>
